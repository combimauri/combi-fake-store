<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="flex items-center gap-2 text-sm font-semibold">
      <combi-icon name="filter" [size]="15" />
      Filters
    </h2>
    @if (hasActiveFilters()) {
      <button
        type="button"
        class="cursor-pointer text-xs font-semibold text-accent hover:underline"
        (click)="clear.emit()"
      >
        Clear all
      </button>
    }
  </div>

  <div>
    <h3 class="mb-2.5 text-xs font-semibold tracking-wider text-muted-foreground uppercase">
      Category
    </h3>

    @if (loading()) {
      <div class="flex flex-wrap gap-2">
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <div class="skeleton h-8 w-20"></div>
        }
      </div>
    } @else {
      <div class="flex flex-wrap gap-2">
        <button
          type="button"
          class="chip"
          [class.chip-active]="!activeCategory()"
          [attr.aria-pressed]="!activeCategory()"
          (click)="categoryChange.emit(undefined)"
        >
          All
        </button>
        @for (facet of visible(); track facet.slug) {
          <button
            type="button"
            class="chip"
            [class.chip-active]="activeCategory() === facet.slug"
            [attr.aria-pressed]="activeCategory() === facet.slug"
            (click)="categoryChange.emit(facet.slug)"
          >
            <span class="max-w-36 truncate">{{ facet.name }}</span>
            <span class="tabular opacity-60">{{ facet.count }}</span>
          </button>
        }
      </div>

      @if (hiddenCount() > 0) {
        <button
          type="button"
          class="mt-2.5 cursor-pointer text-xs font-semibold text-accent hover:underline"
          [attr.aria-expanded]="expanded()"
          (click)="expanded.set(!expanded())"
        >
          {{ expanded() ? 'Show fewer' : 'Show ' + hiddenCount() + ' more' }}
        </button>
      }
    }
  </div>

  <div>
    <h3 class="mb-2.5 text-xs font-semibold tracking-wider text-muted-foreground uppercase">
      Price range
    </h3>
    <div class="flex items-center gap-2">
      <label class="flex-1">
        <span class="sr-only">Minimum price</span>
        <input
          type="number"
          inputmode="numeric"
          class="input tabular"
          placeholder="Min"
          [value]="minPrice() ?? ''"
          (change)="onMin($any($event.target).value)"
        />
      </label>
      <span class="text-muted-foreground" aria-hidden="true">–</span>
      <label class="flex-1">
        <span class="sr-only">Maximum price</span>
        <input
          type="number"
          inputmode="numeric"
          class="input tabular"
          placeholder="Max"
          [value]="maxPrice() ?? ''"
          (change)="onMax($any($event.target).value)"
        />
      </label>
    </div>
  </div>
</div>
